name: CI

on:
  push:
    branches: [main, trust-center]
  pull_request:
    branches: [main, trust-center]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      SESSION_SECRET: dummy-ci-session-secret-at-least-32-chars-long-2026
      IP_HASH_SALT: dummy-ci-ip-hash-salt-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration test suite
        run: npm test

      - name: Build Next.js production bundle
        run: npm run build

      - name: Scan dependencies for vulnerabilities
        run: npm audit --omit=dev --audit-level=high
